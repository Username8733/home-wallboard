[project]
name = "home-wallboard"
version = "0.3.0"
description = "Touch wallboard for Home Assistant, Music Assistant and private photo slideshows"
requires-python = ">=3.10"
dependencies = ["cryptography>=44", "Flask>=3,<4", "requests>=2.31,<3", "websocket-client>=1.9,<2", "Pillow>=10,<13", "pyicloud==2026.10.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
